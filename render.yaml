# Render blueprint: deploys the whole Greptile HUD stack.
#
# Connect this repo in Render ("New" -> "Blueprint"), and it provisions:
#   - the backend API at https://greptile-hud.onrender.com (service name pinned)
#   - the landing page at https://greptile-hud-landing.onrender.com
#   - a Postgres database
#
# To get from "connect" to "live", only two manual steps remain:
#   1. Delete the old hand-made "greptile-hud" service in Render if it exists
#      (the blueprint takes over that name so the URL stays the same).
#   2. Paste GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET into the backend service
#      environment (they are secrets and cannot live in the repo). Register
#      the same values in the GitHub OAuth app with callback:
#      https://greptile-hud.onrender.com/auth/callback

services:
  - type: web
    name: greptile-hud
    runtime: docker
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: greptile-hud-db
          property: connectionString
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GITHUB_REDIRECT_URL
        value: https://greptile-hud.onrender.com/auth/callback
      - key: OAUTH_REDIRECT_SCHEME
        value: greptilehud
      - key: GITHUB_ORGS
        sync: false

  - type: web
    name: greptile-hud-landing
    runtime: static
    staticPublishPath: ./site
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: greptile-hud-db
    databaseName: vibecoders
    plan: free
