# Render blueprint: deploys the whole Greptile HUD stack.
#
# Connect this repo in Render ("New" -> "Blueprint"), and it provisions:
#   - the backend API + landing page (embedded in the binary) at
#     https://greptile-hud.onrender.com (service name pinned)
#   - a Postgres database
#
# No secrets are needed: identity is trust-based (users pick a username), so
# there are no OAuth client credentials or session secrets to paste.
#
# Custom domain (goathud.com): add it under the service's
# Settings -> Custom Domains (DNS is already a CNAME to
# greptile-hud.onrender.com); Render issues the TLS cert automatically.

services:
  - type: web
    name: greptile-hud
    runtime: docker
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: greptile-hud-db
          property: connectionString

databases:
  - name: greptile-hud-db
    databaseName: vibecoders
    plan: free
