name: Release macOS app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}" ./build.sh

      - name: Package and checksum
        run: |
          ditto -c -k --sequesterRsrc --keepParent GreptileHUD.app GreptileHUD.zip
          shasum -a 256 GreptileHUD.zip > GreptileHUD.zip.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" GreptileHUD.zip GreptileHUD.zip.sha256 --generate-notes --verify-tag
