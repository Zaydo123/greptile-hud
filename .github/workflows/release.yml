name: Release macOS app

on:
  push:
    branches:
      - main
    paths:
      - "Sources/**"
      - "scripts/**"
      - "Info.plist"
      - "build.sh"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: greptile-hud-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Choose next release version
        id: version
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          BASE_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          LATEST_TAG="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // ""')"
          VERSION="$(bash scripts/next-version.sh "$BASE_VERSION" "${LATEST_TAG:-v0.0.0}")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building v$VERSION from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Build app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./build.sh

      - name: Verify app
        run: |
          bash -n build.sh scripts/next-version.sh
          plutil -lint Info.plist GreptileHUD.app/Contents/Info.plist
          codesign --verify --deep --strict GreptileHUD.app
          lipo GreptileHUD.app/Contents/MacOS/GreptileHUD -verify_arch x86_64 arm64
          test "$(vtool -show-build GreptileHUD.app/Contents/MacOS/GreptileHUD | grep -c 'minos 13.0')" -eq 2

      - name: Package and checksum
        run: |
          ditto -c -k --sequesterRsrc --keepParent GreptileHUD.app GreptileHUD.zip
          shasum -a 256 GreptileHUD.zip > GreptileHUD.zip.sha256

      - name: Preserve downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: GreptileHUD-${{ steps.version.outputs.version }}
          path: |
            GreptileHUD.zip
            GreptileHUD.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        id: publish
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" GreptileHUD.zip GreptileHUD.zip.sha256 --target "$GITHUB_SHA" --generate-notes --fail-on-no-commits

      - name: Report release permission fallback
        if: steps.publish.outcome == 'failure'
        run: |
          echo "::warning::Release publishing was denied. The verified app remains available as this workflow run's artifact."
          {
            echo "## Release publishing needs repository write access"
            echo "The verified app and checksum were preserved as a 30-day workflow artifact."
            echo "Grant the workflow contents write access or configure a RELEASE_TOKEN secret to restore automatic updater releases."
          } >> "$GITHUB_STEP_SUMMARY"
