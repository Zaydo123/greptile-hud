name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Validate scripts and metadata
        run: |
          bash -n build.sh scripts/next-version.sh
          plutil -lint Info.plist
          grep -q "actions/upload-artifact@v4" .github/workflows/release.yml
          grep -q "continue-on-error: true" .github/workflows/release.yml
          grep -q "secrets.RELEASE_TOKEN" .github/workflows/release.yml
          test "$(bash scripts/next-version.sh 1.1.0 v1.1.0)" = "1.1.1"
          test "$(bash scripts/next-version.sh 1.2.0 v1.1.9)" = "1.2.0"
          if bash scripts/next-version.sh 1.0.0 v1.1.0; then exit 1; fi

      - name: Build universal app
        run: ./build.sh

      - name: Verify app
        run: |
          plutil -lint GreptileHUD.app/Contents/Info.plist
          codesign --verify --deep --strict GreptileHUD.app
          lipo GreptileHUD.app/Contents/MacOS/GreptileHUD -verify_arch x86_64 arm64
          test "$(vtool -show-build GreptileHUD.app/Contents/MacOS/GreptileHUD | grep -c 'minos 13.0')" -eq 2
          git diff --check

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Lint and build
        run: |
          gofmt -l . | (! grep .)
          go vet ./...
          go build ./...

      - name: Build Docker image
        working-directory: .
        run: docker build -t greptilehud-backend-check -f Dockerfile .

  landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check landing page (embedded in backend)
        run: |
          test -f backend/site/index.html
          grep -q "releases/latest/download/GreptileHUD.zip" backend/site/index.html
          grep -q "releases/latest/download/GreptileHUD.zip.sha256" backend/site/index.html
          grep -q "api.github.com/repos/Zaydo123/greptile-hud/releases/latest" backend/site/index.html
          grep -q "go:embed site/index.html" backend/main.go
          ruby -e "require 'yaml'; YAML.load_file('render.yaml'); puts 'render.yaml parses'"

      - name: Check Render blueprint covers everything
        run: |
          ruby -e '
            require "yaml"
            spec = YAML.load_file("render.yaml")
            names = spec["services"].map { |s| s["name"] }
            abort "backend missing" unless names.include?("greptile-hud")
            abort "db missing" unless spec["databases"]&.any? { |d| d["name"] == "greptile-hud-db" }
            backend = spec["services"].find { |s| s["name"] == "greptile-hud" }
            abort "bad health check" unless backend["healthCheckPath"] == "/api/health"
            abort "rootDir set (Render ignores it; Dockerfile must be at repo root)" if backend["rootDir"]
            abort "bad dockerfile" unless backend["dockerfilePath"] == "Dockerfile"
            abort "no db env var" unless backend["envVars"].any? { |e| e["fromDatabase"]&.dig("name") == "greptile-hud-db" }
            legacy_auth = %w[GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET GITHUB_REDIRECT_URL SESSION_SECRET]
            configured = backend["envVars"].map { |e| e["key"] }.compact
            abort "legacy auth configuration present" unless (configured & legacy_auth).empty?
            puts "blueprint OK"
          '
