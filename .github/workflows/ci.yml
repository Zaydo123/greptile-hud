name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Validate scripts and metadata
        run: |
          bash -n build.sh scripts/next-version.sh
          plutil -lint Info.plist
          test "$(bash scripts/next-version.sh 1.1.0 v1.1.0)" = "1.1.1"
          test "$(bash scripts/next-version.sh 1.2.0 v1.1.9)" = "1.2.0"
          if bash scripts/next-version.sh 1.0.0 v1.1.0; then exit 1; fi

      - name: Build universal app
        run: ./build.sh

      - name: Verify app
        run: |
          plutil -lint GreptileHUD.app/Contents/Info.plist
          codesign --verify --deep --strict GreptileHUD.app
          lipo GreptileHUD.app/Contents/MacOS/GreptileHUD -verify_arch x86_64 arm64
          test "$(vtool -show-build GreptileHUD.app/Contents/MacOS/GreptileHUD | grep -c 'minos 13.0')" -eq 2
          git diff --check

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Lint and build
        run: |
          gofmt -l . | (! grep .)
          go vet ./...
          go build ./...

      - name: Build Docker image
        run: docker build -t greptilehud-backend-check .

  landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check landing page
        run: |
          test -f site/index.html
          grep -q "releases/latest/download/GreptileHUD.zip" site/index.html
          grep -q "releases/latest/download/GreptileHUD.zip.sha256" site/index.html
          grep -q "api.github.com/repos/Zaydo123/greptile-hud/releases/latest" site/index.html
          ruby -e "require 'yaml'; YAML.load_file('site/../render.yaml'); puts 'render.yaml parses'"

      - name: Check Render blueprint covers everything
        run: |
          ruby -e '
            require "yaml"
            spec = YAML.load_file("render.yaml")
            names = spec["services"].map { |s| s["name"] }
            abort "backend missing" unless names.include?("greptile-hud")
            abort "landing missing" unless names.include?("greptile-hud-landing")
            abort "db missing" unless spec["databases"]&.any? { |d| d["name"] == "greptile-hud-db" }
            landing = spec["services"].find { |s| s["name"] == "greptile-hud-landing" }
            abort "not static" unless landing["staticPublishPath"] == "./site"
            backend = spec["services"].find { |s| s["name"] == "greptile-hud" }
            abort "bad health check" unless backend["healthCheckPath"] == "/api/health"
            abort "no db env var" unless backend["envVars"].any? { |e| e["fromDatabase"]&.dig("name") == "greptile-hud-db" }
            redirect = backend["envVars"].find { |e| e["key"] == "GITHUB_REDIRECT_URL" }
            abort "redirect URL drift" unless redirect && redirect["value"] == "https://greptile-hud.onrender.com/auth/callback"
            puts "blueprint OK"
          '
