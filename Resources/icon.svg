<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Greptile HUD app icon — Tokyo Night "HUD eyes" mark.
       Source of truth: Resources/GreptileHUD.icns is generated from this by
       scripts/make-icon.sh (macOS: sips + iconutil). Keep the palette in sync
       with Sources/Theme.swift (Tokyo). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1B26"/>
      <stop offset="1" stop-color="#16161E"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#7AA2F7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7AA2F7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded badge -->
  <rect x="0" y="0" width="1024" height="1024" rx="231" ry="231" fill="url(#bg)"/>
  <rect x="86" y="86" width="852" height="852" rx="205" ry="205" fill="url(#halo)"/>

  <!-- Scope reticle ring -->
  <circle cx="512" cy="512" r="312" fill="none" stroke="#7AA2F7" stroke-opacity="0.42" stroke-width="9"/>

  <!-- Corner HUD brackets -->
  <g stroke="#7AA2F7" stroke-opacity="0.78" stroke-linecap="round" stroke-width="9">
    <line x1="159" y1="159" x2="236" y2="159"/>
    <line x1="159" y1="159" x2="159" y2="236"/>
    <line x1="865" y1="159" x2="788" y2="159"/>
    <line x1="865" y1="159" x2="865" y2="236"/>
    <line x1="159" y1="865" x2="236" y2="865"/>
    <line x1="159" y1="865" x2="159" y2="788"/>
    <line x1="865" y1="865" x2="788" y2="865"/>
    <line x1="865" y1="865" x2="865" y2="788"/>
  </g>

  <!-- Eyes: two vertical rounded pills, cyan outline, dim fill -->
  <g>
    <rect x="400" y="418" width="90" height="188" rx="45" ry="45" fill="#2F334D" stroke="#7DCFFF" stroke-width="12"/>
    <rect x="534" y="418" width="90" height="188" rx="45" ry="45" fill="#2F334D" stroke="#7DCFFF" stroke-width="12"/>
    <circle cx="445" cy="512" r="21" fill="#7AA2F7"/>
    <circle cx="579" cy="512" r="21" fill="#7AA2F7"/>
    <circle cx="439" cy="504" r="7" fill="#FFFFFF"/>
    <circle cx="573" cy="504" r="7" fill="#FFFFFF"/>
  </g>
</svg>